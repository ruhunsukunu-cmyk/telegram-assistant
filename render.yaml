services:
  - type: web
    name: telegram-assistant-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DEFAULT_CITY
        value: Istanbul
      - key: TIMEZONE
        value: Europe/Istanbul
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
